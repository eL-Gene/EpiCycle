[metadata]
name = napari-epicycle
version = 0.1.2
description = Segmentation Plugin for Stratified Epithelia
long_description = file: README.md
long_description_content_type = text/markdown
author = Elgene John A. Quitevis
license = GPL-3.0-or-later

[options]
include_package_data = True
python_requires = >=3.11,<3.13
# Direct deps EpiCycle actually imports (AST-scanned 2026-05-27).
# Versions match the proven epicycle-labtest smoke-test env (2026-05-29).
# Qt backend is NOT listed here — napari plugin rule. Use the [pyqt6] extra.
# u-segment3D is not on PyPI; pinned by commit (archive URL, no git needed).
install_requires =
    # napari + Qt abstraction
    napari==0.8.0
    qtpy==2.4.3
    magicgui==0.10.1
    superqt>=0.7.8
    qtawesome==1.4.1
    pyqtgraph==0.13.7
    vispy>=0.16.2,<0.17

    # Scientific core
    numpy==1.26.4
    scipy==1.15.3
    scikit-image==0.25.2
    scikit-learn==1.7.0
    pandas==2.3.0
    matplotlib==3.10.3
    tifffile==2025.5.10
    # napari's reader chain imports zarr when opening files; absent on a fresh
    # env it surfaces as a user-facing "failed to read: no module named zarr".
    # MUST stay <3: zarr 3.x requires numpy>=2, which collides with u-Segment3D's
    # numpy<2.0 pin (and the numpy==1.26.4 lock).  (Added 2026-08-01, py3.12 migration.)
    zarr>=2.18,<3
    psutil==7.0.0
    # scaled-segmentation engine (packages/epicycle_scaledseg)
    tqdm
    pyarrow>=8

    # QC clustering (HDBSCAN/KMeans/GMM come from sklearn)
    umap-learn==0.5.11
    leidenalg==0.11.0
    python-igraph==1.0.0

    # Segmentation engines
    cellpose==3.1.1.2
    segment-anything==1.0
    u-Segment3D @ https://github.com/DanuserLab/u-segment3D/archive/5d11e1efad810409ef3ebccf25101484b97d42fb.zip

[options.extras_require]
# Qt backend — install the pyqt6 extra for a fresh env without napari already
# wired up.  Skip if your env already has a Qt binding via napari[all] / conda.
# (pyqt5 extra removed 2026-07-31: PyQt5 is deprecated in napari 0.8.0, removal ~Q4 2026.)
pyqt6 =
    PyQt6==6.9.1
# Scaled-segmentation engine: optional plotting (reconcile render) and tutorials.
scaledseg-viz =
    plotly>=5
tutorials =
    plotly>=5
    kaleido
    pyvista

[options.entry_points]
napari.manifest =
    napari-epicycle = napari_epicycle:napari.yaml
console_scripts =
    epicycle-scaledseg = packages.epicycle_scaledseg.cli.main:main
