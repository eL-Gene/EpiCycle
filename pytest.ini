[pytest]
minversion = 6.0
addopts = -ra -q
testpaths = 
    tests
python_files = test_*.py
markers =
    gpu: requires a CUDA GPU + Cellpose model weights (scaledseg engine)
    slow: long-running (scaledseg engine: full-stack reconstruction, large-volume stitch)
    zarr: exercises the optional zarr/OME-Zarr IO seam (scaledseg engine)
    characterization: locks current Mode-A behaviour of the scaledseg engine
